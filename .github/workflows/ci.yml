name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The SDK build runs scripts/size.mjs, which fails above the per-entry
      # gzip budgets and writes a size table to the job summary. It must run
      # before typecheck: the showcase resolves `formatir` through its dist.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
