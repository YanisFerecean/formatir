name: Publish formatir to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run npm publish with --dry-run
        type: boolean
        default: false

# `id-token: write` lets npm mint the provenance attestation via OIDC.
# No NPM_TOKEN is needed: the package is published through a Trusted Publisher
# (npmjs.com -> package -> Settings -> Trusted Publisher -> GitHub Actions).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing over OIDC requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (fails above the 5 KB gzip budget)
        run: pnpm --filter formatir build

      - name: Verify package contents
        run: npm pack --dry-run
        working-directory: packages/formatir-sdk

      - name: Publish with provenance
        run: npm publish --provenance --access public ${{ inputs.dry-run && '--dry-run' || '' }}
        working-directory: packages/formatir-sdk
